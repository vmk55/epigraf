  Автор ідеї та застосунку: vmk55 (github.com/vmk55)
  Прохання до тих, хто поширює цей файл: зберігайте це посилання на авторство.

<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Епіграф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b2420;
    --ink: #241f18;
    --ink-soft: #4a4136;
    --muted: #8b9a8e;
    --card: #f2ede0;
    --rule-red: #a53d3d;
    --gold: #b99141;
    --gold-deep: #8f6f2c;
    --green: #45604a;
    --danger: #8c3b3b;
    --max-w: 700px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(185,145,65,0.06), transparent 40%),
      radial-gradient(circle at 90% 30%, rgba(69,96,74,0.10), transparent 45%);
    color: var(--card);
    font-family: 'Work Sans', -apple-system, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .wrap{max-width: var(--max-w); margin: 0 auto; padding: 20px 18px 0;}
  .lang-switch{display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-bottom: 14px;}
  .lang-switch label{font-size:0.78rem; color: var(--muted);}
  .lang-switch select{width:auto; padding:6px 10px; font-size:0.82rem;}

  header.top{padding: 6px 4px 22px; border-bottom: 1px solid rgba(242,237,224,0.14); margin-bottom: 22px;}
  header.top h1{
    font-family:'Source Serif 4', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 2.1rem;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }
  header.top p{margin:0; color: var(--muted); font-size: 0.95rem; max-width: 46ch;}

  nav.tabs{display:flex; gap: 4px; margin-bottom: 26px; border-bottom: 1px solid rgba(242,237,224,0.14); flex-wrap: wrap;}
  nav.tabs button{
    background:none; border:none; color: var(--muted); font-family:'Work Sans',sans-serif;
    font-size: 0.92rem; padding: 10px 4px; margin-right: 20px; cursor:pointer;
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  }
  nav.tabs button.active{color: var(--card); border-bottom-color: var(--gold);}
  nav.tabs button:hover{color: var(--card);}

  section.view{display:none;}
  section.view.active{display:block;}

  label.field-label{display:block; font-size:0.85rem; color: var(--muted); margin-bottom:6px;}
  textarea, input[type=text], input[type=search], select{
    width:100%; background: rgba(242,237,224,0.06); border: 1px solid rgba(242,237,224,0.22);
    color: var(--card); border-radius: 3px; padding: 10px 12px; font-family:'Work Sans',sans-serif;
    font-size: 0.98rem; resize: vertical;
  }
  textarea::placeholder, input::placeholder{color: rgba(242,237,224,0.4);}
  textarea:focus, input:focus, select:focus, button:focus-visible{
    outline: 2px solid var(--gold); outline-offset: 1px;
  }
  select option{color:#000;}
  .field{margin-bottom: 18px;}
  .row{display:flex; gap: 12px; flex-wrap: wrap;}
  .row > .field{flex:1; min-width: 140px;}

  .btn{
    display:inline-block; border:none; border-radius: 3px; padding: 11px 20px;
    font-family:'Work Sans',sans-serif; font-size: 0.92rem; font-weight:600; cursor:pointer;
    transition: transform .1s, background .15s;
  }
  .btn:active{transform: translateY(1px);}
  .btn-primary{background: var(--gold); color: #201a0d;}
  .btn-primary:hover{background: var(--gold-deep);}
  .btn-ghost{background: transparent; color: var(--card); border: 1px solid rgba(242,237,224,0.3);}
  .btn-ghost:hover{border-color: var(--card);}
  .btn-danger{background: transparent; color: #d99; border: 1px solid rgba(140,59,59,0.6); font-weight:500;}
  .btn-danger:hover{background: rgba(140,59,59,0.18);}
  .btn-small{padding: 6px 12px; font-size: 0.82rem;}

  fieldset.tones{border:none; padding:0; margin:0;}
  fieldset.tones legend{font-size:0.85rem; color:var(--muted); padding:0; margin-bottom:8px;}
  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius: 999px;
    border:1px solid rgba(242,237,224,0.28); font-size:0.85rem; cursor:pointer; user-select:none;
    color: var(--muted); transition: all .12s;
  }
  .chip input{display:none;}
  .chip.checked{background: rgba(185,145,65,0.16); border-color: var(--gold); color: var(--card);}

  .toggle-line{display:flex; align-items:center; gap:10px; margin: 14px 0 20px; color: var(--muted); font-size:0.9rem;}
  .toggle-line input{width:16px; height:16px;}

  .analysis-box{
    background: rgba(242,237,224,0.05); border-left: 3px solid var(--green);
    padding: 12px 14px; margin: 4px 0 22px; font-size: 0.86rem; color: var(--muted);
  }
  .analysis-box b{color: var(--card); font-weight:600;}
  .kw-chip{display:inline-block; background: rgba(69,96,74,0.3); color:#cfe0d2; padding:2px 9px; border-radius:999px; font-size:0.78rem; margin: 2px 4px 2px 0;}

  .card{
    background: var(--card); color: var(--ink); border-left: 5px solid var(--rule-red);
    border-radius: 2px; padding: 18px 20px 16px; margin-bottom: 16px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.28);
    position: relative;
  }
  .card:nth-child(odd){transform: rotate(-0.15deg);}
  .card:nth-child(even){transform: rotate(0.15deg);}
  .card .score-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .score{font-family:'Source Serif 4',serif; font-weight:600; font-size:1.35rem; color: var(--rule-red);}
  .score-label{font-size:0.72rem; color: var(--ink-soft); letter-spacing:0.2px;}
  .quote{font-family:'Source Serif 4', Georgia, serif; font-size:1.18rem; font-style: italic; line-height:1.45; margin: 0 0 8px; white-space: pre-wrap;}
  .quote-author{font-size:0.88rem; color: var(--ink-soft); margin-bottom: 10px;}
  .why{font-size:0.83rem; color: var(--ink-soft); margin-bottom: 12px; line-height:1.4;}
  .why b{color: var(--ink);}
  .card-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .card-actions .btn-primary{background: var(--green); color:#fff;}
  .card-actions .btn-primary:hover{background:#374d3b;}
  .card-actions .btn-ghost{border-color: rgba(36,31,24,0.35); color: var(--ink);}
  .card-actions .btn-ghost:hover{border-color: var(--ink);}
  .badge-unexpected{display:inline-block; background: var(--gold); color:#241f18; font-size:0.7rem; font-weight:700; padding: 2px 8px; border-radius:3px; margin-bottom:8px;}
  .badge-epigraph{display:inline-block; background: var(--green); color:#fff; font-size:0.72rem; font-weight:700; padding: 4px 10px; border-radius:3px;}

  .selection-item{
    background: rgba(242,237,224,0.06); border: 1px solid rgba(242,237,224,0.18); border-left: 3px solid var(--gold);
    border-radius: 2px; padding: 12px 14px; margin-bottom: 10px;
  }
  .selection-item .quote{font-size:1.0rem; margin-bottom:4px;}
  .selection-item .quote-author{margin-bottom:8px;}
  .selection-item .row{align-items:center;}

  .empty-note{color: var(--muted); font-size:0.9rem; padding: 20px 0;}

  .preview-page{
    background: var(--card); color: var(--ink); padding: 34px 28px; border-radius:2px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35); margin-top: 10px;
  }
  .preview-page blockquote{
    margin: 0 0 26px; padding-left: 16px; border-left: 3px solid var(--rule-red);
    font-family:'Source Serif 4',serif; font-style: italic; font-size:1.05rem; line-height:1.5;
  }
  .preview-page blockquote cite{display:block; font-style:normal; font-size:0.82rem; color: var(--ink-soft); margin-top:6px;}
  .preview-page p.body-dummy{color: var(--ink-soft); font-size:0.92rem; line-height:1.6;}
  .translation-note{font-size:0.75rem; color: var(--muted); margin-top:-16px; margin-bottom:20px;}

  .bank-item{
    background: rgba(242,237,224,0.05); border: 1px solid rgba(242,237,224,0.14);
    border-radius: 3px; padding: 14px 16px; margin-bottom: 12px;
  }
  .bank-item .text{font-family:'Source Serif 4',serif; font-style:italic; font-size:1.02rem; margin-bottom:6px; white-space:pre-wrap;}
  .bank-item .meta{font-size:0.78rem; color: var(--muted); margin-bottom:10px;}
  .bank-item .meta span{margin-right: 12px;}
  .bank-item .actions{display:flex; gap:8px;}

  details.add-form{background: rgba(242,237,224,0.05); border:1px solid rgba(242,237,224,0.16); border-radius:4px; padding: 4px 16px 16px; margin-bottom: 22px;}
  details.add-form summary{padding: 14px 0; cursor:pointer; font-weight:600; font-size:0.95rem; list-style:none;}
  details.add-form summary::-webkit-details-marker{display:none;}
  details.add-form summary:before{content:"+ "; color: var(--gold);}
  details.add-form[open] summary:before{content:"\2013 ";}

  .import-export{display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 24px;}
  input[type=file]{color: var(--muted); font-size: 0.82rem;}

  .stat-grid{display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 26px;}
  .stat-box{background: rgba(242,237,224,0.05); border:1px solid rgba(242,237,224,0.16); border-radius:4px; padding: 14px 16px;}
  .stat-box .num{font-family:'Source Serif 4',serif; font-size:1.7rem; font-weight:600; color: var(--gold);}
  .stat-box .lbl{font-size:0.8rem; color: var(--muted);}
  .top-list{font-size:0.88rem;}
  .top-list li{margin-bottom: 8px; color: var(--muted);}
  .top-list li b{color: var(--card); font-style: italic; font-family:'Source Serif 4',serif; font-weight:500;}

  .search-mode{display:flex; gap: 18px; margin-bottom: 14px; font-size:0.88rem; color: var(--muted); flex-wrap: wrap;}
  .search-mode label{display:flex; align-items:center; gap:6px; cursor:pointer;}

  footer.credit{text-align:center; color: rgba(242,237,224,0.35); font-size:0.75rem; margin-top: 50px;}
  footer.credit a{color: rgba(242,237,224,0.5);}

  #showMoreWrap{text-align:center; margin: 6px 0 20px;}
  h3.section-heading{font-family:'Source Serif 4',serif; font-weight:500; font-size:1.05rem;}

  @media (max-width: 480px){
    .stat-grid{grid-template-columns: 1fr;}
    header.top h1{font-size:1.7rem;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="lang-switch">
    <label for="uiLangSelect" id="interfaceLangLabelEl">Мова інтерфейсу</label>
    <select id="uiLangSelect"></select>
  </div>

  <header class="top">
    <h1 id="appTitleEl">Епіграф</h1>
    <p id="appSubtitleEl"></p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="search" id="tabSearchBtn"></button>
    <button class="tab-btn" data-tab="bank" id="tabBankBtn"></button>
    <button class="tab-btn" data-tab="stats" id="tabStatsBtn"></button>
  </nav>

  <section class="view active" id="view-search">

    <div class="search-mode">
      <label><input type="radio" name="searchMode" value="draft" checked> <span id="modeDraftLabel"></span></label>
      <label><input type="radio" name="searchMode" value="short"> <span id="modeShortLabel"></span></label>
    </div>

    <div class="field">
      <label class="field-label" id="draftLabel"></label>
      <textarea id="draftInput" rows="7"></textarea>
    </div>

    <fieldset class="tones">
      <legend id="toneLegendEl"></legend>
      <div class="chip-group" id="toneChips"></div>
    </fieldset>

    <div class="toggle-line">
      <input type="checkbox" id="unexpectedMode">
      <label for="unexpectedMode" id="unexpectedLabelEl"></label>
    </div>

    <div class="row">
      <button class="btn btn-primary" id="findBtn"></button>
      <button class="btn btn-ghost" id="clearBtn"></button>
    </div>

    <div id="analysisBox" style="display:none;"></div>
    <div id="resultsArea" style="margin-top:20px;"></div>
    <div id="showMoreWrap" style="display:none;">
      <button class="btn btn-ghost btn-small" id="showMoreBtn"></button>
    </div>

    <div id="selectionWrap" style="display:none;">
      <h3 class="section-heading" id="selectionHeadingEl"></h3>
      <div id="selectionArea"></div>
    </div>

    <div id="previewArea"></div>

  </section>

  <section class="view" id="view-bank">

    <details class="add-form" id="addForm">
      <summary><span id="addFormSummaryEl"></span></summary>
      <div class="field">
        <label class="field-label" id="af_textLabelEl"></label>
        <textarea id="af_text" rows="3"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label class="field-label" id="af_authorLabelEl"></label>
          <input type="text" id="af_author">
        </div>
        <div class="field">
          <label class="field-label" id="af_langLabelEl"></label>
          <select id="af_lang"></select>
        </div>
      </div>
      <div class="field">
        <label class="field-label" id="af_themesLabelEl"></label>
        <input type="text" id="af_themes">
      </div>
      <div class="field">
        <label class="field-label" id="af_keywordsLabelEl"></label>
        <input type="text" id="af_keywords">
      </div>
      <fieldset class="tones" style="margin-bottom:16px;">
        <legend id="af_toneLegendEl"></legend>
        <div class="chip-group" id="af_toneChips"></div>
      </fieldset>
      <div class="field">
        <label class="field-label" id="af_moodLabelEl"></label>
        <input type="text" id="af_mood">
      </div>
      <div class="row">
        <button class="btn btn-ghost btn-small" id="autoIndexBtn"></button>
        <button class="btn btn-primary" id="saveAfBtn"></button>
      </div>
      <input type="hidden" id="af_editId" value="">
    </details>

    <div class="import-export">
      <button class="btn btn-ghost btn-small" id="exportJsonBtn"></button>
      <button class="btn btn-ghost btn-small" id="exportCsvBtn"></button>
      <label class="btn btn-ghost btn-small" style="cursor:pointer;">
        <span id="importFileBtnEl"></span>
        <input type="file" id="importFile" accept=".csv,.json,.txt" style="display:none;">
      </label>
    </div>
    <div class="field" style="max-width:280px;">
      <label class="field-label" id="importTxtLangLabelEl"></label>
      <select id="importTxtLang"></select>
    </div>
    <p id="importHintEl" style="font-size:0.78rem; color:var(--muted); margin-top:-14px;"></p>

    <div class="field">
      <input type="search" id="bankSearch">
    </div>

    <div id="bankList"></div>

  </section>

  <section class="view" id="view-stats">
    <div class="stat-grid" id="statGrid"></div>
    <h3 class="section-heading" id="topSelectedHeadingEl"></h3>
    <ul class="top-list" id="topSelected"></ul>
    <h3 class="section-heading" id="topUsedHeadingEl"></h3>
    <ul class="top-list" id="topUsed"></ul>
  </section>

  <footer class="credit">
    <span id="footerTextEl"></span> · <a href="https://github.com/vmk55" target="_blank" rel="noopener">github.com/vmk55</a>
  </footer>
</div>

    'което','които',
    'i','a','ale','albo','czy','że','jak','to','ten','ta','te','tamten','on','ona','ono','oni','one','ja','ty','my','wy',
    'mnie','ciebie','jego','jej','ich','nas','was','nie','już','jeszcze','bardzo','tylko','tak','tam','tu','gdzie','kiedy',
    'dokąd','w','we','na','z','ze','do','od','po','za','dla','o','nad','pod','między','przez','bez','przed','być','jest',
    'są','był','była','było','byli','będzie','będą','ma','mają','można','trzeba','swój','swoja','swoje','każdy','która',
    'które','którzy','ponieważ','żeby','chociaż','jednak'
  ]);

  function tokenize(text){
    if(!text) return [];
    var clean = text.toLowerCase().replace(/['’ʼ]/g,'').replace(/[^a-zа-яіїєґёў0-9äöüßàâéèêëïîôùûÿçœæìíòóúãõñćęłńśźżą\s]/gi,' ');
    var words = clean.split(/\s+/).filter(function(w){
      return w.length > 2 && !STOPWORDS.has(w);
    });
    return words;
  }

  // Lightweight suffix-stripping stemmer for Cyrillic (uk/ru/be/bg) words, so
  // inflected forms like "сила" / "сильним" / "сильної" match as one root.
  // Latin-script words are left as-is (their inflection is milder and a
  // suffix list tuned for Slavic endings would do more harm than good there).
  var SLAVIC_ENDINGS = [
    'иться','ються','ится','атиме','итиме','ившись','явшись',
    'ами','ями','ому','его','ыми','ими','їми','емо','ете','ять','ать','ити','ути','яти',
    'ів','ей','ам','ям','ах','ях','ою','ею','ій','ім','им','их','ий','ого',
    'а','я','о','е','є','и','і','ю','ь','у','ы'
  ];
  function stemWord(w){
    if(!/[а-яіїєґёў]/.test(w)) return w;
    for(var i=0;i<SLAVIC_ENDINGS.length;i++){
      var end = SLAVIC_ENDINGS[i];
      if(w.length - end.length >= 3 && w.slice(-end.length) === end){
        return w.slice(0, -end.length);
      }
    }
    return w;
  }

  function extractKeywords(text, topN){
    topN = topN || 15;
    var words = tokenize(text);
    var freq = {};
    var display = {};
    words.forEach(function(w){
      var stem = stemWord(w);
      freq[stem] = (freq[stem]||0) + 1;
      if(!display[stem]) display[stem] = w;
    });
    var arr = Object.keys(freq).map(function(stem){ return [stem, freq[stem], display[stem]]; });
    arr.sort(function(a,b){ return b[1]-a[1]; });
    return arr.slice(0, topN);
  }

  function splitMulti(str){
    if(!str) return [];
    return str.split(/[;,]/).map(function(s){ return s.trim().toLowerCase(); }).filter(Boolean);
  }

  function aphorismProfile(af){
    var set = new Set();
    (af.themes||[]).forEach(function(t){ set.add(stemWord(t.toLowerCase())); });
    (af.keywords||[]).forEach(function(k){ set.add(stemWord(k.toLowerCase())); });
    tokenize(af.text).forEach(function(w){ set.add(stemWord(w)); });
    return set;
  }

  function scoreLabel(score){
    if(score>=90) return t('scoreVeryHigh');
    if(score>=75) return t('scoreHigh');
    if(score>=60) return t('scoreGood');
    if(score>=40) return t('scorePossible');
    return t('scoreUnlikely');

  function explainMatch(res){
    var parts = [];
    if(res.matched.length){
      parts.push(t('explainMatchedPrefix') + ' <b>' + res.matched.slice(0,5).join(', ') + '</b>.');
    }
    if(res.matchedThemes.length){
      parts.push(t('explainThemeMatch'));
    }
    if(res.toneHit){
      parts.push(t('explainToneHit'));
    }
    if(res.toneMiss){
      parts.push(t('explainToneMiss'));
    }
    if(!parts.length){
      parts.push(t('explainWeak'));
    }
    return parts.join(' ');
  }

  function scoreAphorism(draftKw, desiredTones, af){
    var profile = aphorismProfile(af);
    var matched = [];
    draftKw.forEach(function(kv){
      if(profile.has(kv[0])) matched.push(kv[2]);
    });
    var distinctDraft = Math.min(8, draftKw.length || 1);
    var overlapCount = Math.min(matched.length, distinctDraft);
    var overlapRatio = distinctDraft ? overlapCount/distinctDraft : 0;

    var score = 18 + overlapRatio*65;

    var matchedThemes = (af.themes||[]).filter(function(th){
      var thStem = stemWord(th.toLowerCase());
      return draftKw.some(function(kv){ return kv[0]===thStem; });
    });
    score += Math.min(matchedThemes.length,2) * 4;

    var toneHit = desiredTones.length>0 && (af.tone||[]).some(function(tn){ return desiredTones.indexOf(tn)>=0; });
    if(toneHit) score += 11;
    var toneMiss = desiredTones.length>0 && !toneHit;

    if(matched.length===0 && !toneHit) score = 8 + Math.random()*10;

    score = Math.max(4, Math.min(97, Math.round(score)));
    return {score: score, matched: matched, matchedThemes: matchedThemes, toneHit: toneHit, toneMiss: toneMiss};
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function runSearch(){
    var text = document.getElementById('draftInput').value.trim();
    if(!text){ alert(t('noTextAlert')); return; }
    if(bank.length===0){ alert(t('emptyBankAlert')); return; }
    var mode = document.querySelector('input[name=searchMode]:checked').value;

    var draftKw = extractKeywords(text, mode==='short' ? 8 : 15);
    lastDraftKw = draftKw;
    var desiredTones = getCheckedTones(document.getElementById('toneChips'));
    var unexpected = document.getElementById('unexpectedMode').checked;
    lastUnexpected = unexpected;

    var scored = bank.map(function(af){
      var r = scoreAphorism(draftKw, desiredTones, af);
      r.af = af;
      return r;
    });

    if(unexpected){
      var contrastPool = scored.filter(function(r){ return r.matched.length>0; });
      contrastPool.sort(function(a,b){
        var aMismatch = (desiredTones.length>0 && a.toneMiss) ? 1 : 0;
        var bMismatch = (desiredTones.length>0 && b.toneMiss) ? 1 : 0;
        if(aMismatch !== bMismatch) return bMismatch - aMismatch;
        return b.matched.length - a.matched.length;
      });
      currentResults = contrastPool.length ? contrastPool : scored.sort(function(a,b){return b.score-a.score;});
    } else {
      scored.sort(function(a,b){ return b.score - a.score; });
      currentResults = scored;
    }

    shownCount = 0;
    renderAnalysis(draftKw);
    document.getElementById('resultsArea').innerHTML = '';
    document.getElementById('previewArea').innerHTML = '';
    lastPreviewAf = null;
    selection = [];
    epigraphId = null;
    renderSelection();
    showMoreResults(unexpected);
  }

  function normalizeToneToken(tok){

  function parseCsv(str){
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    for(var i=0;i<str.length;i++){
      var c = str[i];
      if(inQuotes){
        if(c === '"'){
          if(str[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n' || c === '\r'){
          if(c === '\r' && str[i+1] === '\n') i++;
          row.push(field); field='';
          rows.push(row); row=[];
        } else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length>1 || (r[0]&&r[0].trim()); });
  }

  function importCsvText(text){
    var rows = parseCsv(text);
    if(!rows.length) return 0;
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var count = 0;
    for(var i=1;i<rows.length;i++){
      var r = rows[i];
      var obj = {};
      header.forEach(function(h, idx){ obj[h] = r[idx] || ''; });
      if(!obj.text) continue;
      bank.push({
        id: genId(),
        text: obj.text.trim(),
        author: (obj.author||'').trim(),
        language: (obj.language||'uk').trim() || 'uk',
        themes: splitMulti(obj.themes),
        keywords: splitMulti(obj.keywords).length ? splitMulti(obj.keywords) : extractKeywords(obj.text,8).map(function(kv){return kv[2];}),
        tone: splitMulti(obj.tone).map(normalizeToneToken),
        mood: (obj.mood||'').trim(),
        selectedCount:0, usedCount:0, dateAdded: new Date().toISOString()
      });
      count++;
    }
    return count;
  }

  function importJsonText(text){
    var arr;
    try{ arr = JSON.parse(text); }catch(e){ alert(t('importJsonError')); return 0; }
    if(!Array.isArray(arr)) return 0;
    var count = 0;
    arr.forEach(function(obj){
      if(!obj.text) return;
      var toneArr = Array.isArray(obj.tone) ? obj.tone : splitMulti(obj.tone);
      bank.push({
        id: genId(),
        text: obj.text,
        author: obj.author||'',
        language: obj.language||'uk',
        themes: Array.isArray(obj.themes) ? obj.themes : splitMulti(obj.themes),
        keywords: Array.isArray(obj.keywords) && obj.keywords.length ? obj.keywords : (splitMulti(obj.keywords).length?splitMulti(obj.keywords):extractKeywords(obj.text,8).map(function(kv){return kv[2];})),
        tone: toneArr.map(normalizeToneToken),
        mood: obj.mood||'',
        selectedCount: obj.selectedCount||0, usedCount: obj.usedCount||0,
        dateAdded: obj.dateAdded || new Date().toISOString()
      });
      count++;
    });
    return count;
  }

  function importTxtText(text, lang){
    var blocks = text.split(/\n\s*\n/);
    var count = 0;
    blocks.forEach(function(block){
      var lines = block.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      if(!lines.length) return;
      var author = '';
      var last = lines[lines.length-1];
      if(/^[—\-]/.test(last)){
        author = last.replace(/^[—\-]\s*/, '');
        lines = lines.slice(0, -1);
      }
      var aphText = lines.join('\n').trim();
      if(!aphText) return;
      bank.push({
        id: genId(), text: aphText, author: author, language: lang || 'uk',
        themes: [], keywords: extractKeywords(aphText,8).map(function(kv){return kv[2];}),
        tone: [], mood: '', selectedCount:0, usedCount:0, dateAdded: new Date().toISOString()
      });
      count++;
    });
    return count;
  }

  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var text = reader.result;
      var n = 0;
      if(/\.json$/i.test(file.name)) n = importJsonText(text);
      else if(/\.csv$/i.test(file.name)) n = importCsvText(text);
      else n = importTxtText(text, document.getElementById('importTxtLang').value);
      saveBank(bank);
      renderBankList();
      alert(t('importedAlert', {n:n}));
      e.target.value = '';
    };
    reader.readAsText(file, 'UTF-8');
  });

  function renderStats(){
    var langs = new Set(bank.map(function(a){ return a.language; }));
    var themes = new Set();
    bank.forEach(function(a){ (a.themes||[]).forEach(function(th){ themes.add(th); }); });
    var totalSelected = bank.reduce(function(s,a){ return s+(a.selectedCount||0); }, 0);

    function stat(n, label){
      return '<div class="stat-box"><div class="num">'+n+'</div><div class="lbl">'+label+'</div></div>';
    }
    document.getElementById('statGrid').innerHTML =
      stat(bank.length, t('statTotal')) +
      stat(langs.size, t('statLangs')) +
      stat(themes.size, t('statThemes')) +
      stat(totalSelected, t('statSelectedTotal'));

    var bySelected = bank.slice().sort(function(a,b){ return (b.selectedCount||0)-(a.selectedCount||0); }).slice(0,5).filter(function(a){return a.selectedCount>0;});
    var byUsed = bank.slice().sort(function(a,b){ return (b.usedCount||0)-(a.usedCount||0); }).slice(0,5).filter(function(a){return a.usedCount>0;});

    document.getElementById('topSelected').innerHTML = bySelected.length ? bySelected.map(function(a){
      return '<li><b>'+escapeHtml(a.text.slice(0,60))+(a.text.length>60?'…':'')+'</b> — '+(a.selectedCount)+' '+t('timesSuffix')+'</li>';
    }).join('') : '<li>'+t('noDataYet')+'</li>';

    document.getElementById('topUsed').innerHTML = byUsed.length ? byUsed.map(function(a){
      return '<li><b>'+escapeHtml(a.text.slice(0,60))+(a.text.length>60?'…':'')+'</b> — '+(a.usedCount)+' '+t('timesSuffix')+'</li>';
    }).join('') : '<li>'+t('noDataYet')+'</li>';
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab === 'bank') renderBankList();
      if(btn.dataset.tab === 'stats') renderStats();
    });
  });

  document.querySelectorAll('input[name=searchMode]').forEach(function(r){
    r.addEventListener('change', function(){
      var draftInput = document.getElementById('draftInput');
      if(r.value === 'short' && r.checked){
        setText('draftLabel', t('draftLabelShort'));
        draftInput.rows = 2;
        draftInput.placeholder = t('draftPlaceholderShort');
      } else if (r.checked){
        setText('draftLabel', t('draftLabelDraft'));
        draftInput.rows = 7;
        draftInput.placeholder = t('draftPlaceholderDraft');
      }
    });
  });

  function applyLanguage(lang){
    if(UI_LANGS.indexOf(lang)<0) lang = 'uk';
    currentLang = lang;
    localStorage.setItem(UI_LANG_KEY, lang);
    document.documentElement.lang = lang;
    uiLangSelect.value = lang;

    setText('interfaceLangLabelEl', t('interfaceLangLabel'));
    setText('appTitleEl', t('appTitle'));
    setText('appSubtitleEl', t('appSubtitle'));
    setText('tabSearchBtn', t('tabSearch'));
    setText('tabBankBtn', t('tabBank'));
    setText('tabStatsBtn', t('tabStats'));

    setText('modeDraftLabel', t('modeDraft'));
    setText('modeShortLabel', t('modeShort'));
    var shortMode = document.querySelector('input[name=searchMode]:checked').value === 'short';
    setText('draftLabel', shortMode ? t('draftLabelShort') : t('draftLabelDraft'));
    setPlaceholder('draftInput', shortMode ? t('draftPlaceholderShort') : t('draftPlaceholderDraft'));
    setText('toneLegendEl', t('toneLegend'));
    setText('unexpectedLabelEl', t('unexpectedLabel'));
    setText('findBtn', t('findBtn'));
    setText('clearBtn', t('clearBtn'));
    setText('showMoreBtn', t('showMoreBtn'));

    var searchTones = getCheckedTones(document.getElementById('toneChips'));
    buildToneChips(document.getElementById('toneChips'), 'tone', searchTones);

    setText('addFormSummaryEl', t('addFormSummary'));
    setText('af_textLabelEl', t('fieldTextLabel'));
    setPlaceholder('af_text', t('fieldTextPlaceholder'));
    setText('af_authorLabelEl', t('fieldAuthorLabel'));
    setPlaceholder('af_author', t('fieldAuthorPlaceholder'));
    setText('af_langLabelEl', t('fieldLangLabel'));
    var afLangSel = document.getElementById('af_lang');
    var afLangVal = afLangSel.value || 'uk';
    fillLangSelect(afLangSel, afLangVal);
    setText('importTxtLangLabelEl', t('importTxtLangLabel'));
    var importLangSel = document.getElementById('importTxtLang');
    var importLangVal = importLangSel.value || 'uk';
    fillLangSelect(importLangSel, importLangVal);
    setText('af_themesLabelEl', t('fieldThemesLabel'));
    setPlaceholder('af_themes', t('fieldThemesPlaceholder'));
    setText('af_keywordsLabelEl', t('fieldKeywordsLabel'));
    setPlaceholder('af_keywords', t('fieldKeywordsPlaceholder'));
    setText('af_toneLegendEl', t('toneFieldsetLegend'));
    var afTones = getCheckedTones(document.getElementById('af_toneChips'));
    buildToneChips(document.getElementById('af_toneChips'), 'af_tone', afTones);
    setText('af_moodLabelEl', t('fieldMoodLabel'));
    setPlaceholder('af_mood', t('fieldMoodPlaceholder'));
    setText('autoIndexBtn', t('autoIndexBtn'));
    setText('saveAfBtn', t('saveAfBtn'));

    setText('exportJsonBtn', t('exportJsonBtn'));
    setText('exportCsvBtn', t('exportCsvBtn'));
    setText('importFileBtnEl', t('importFileBtn'));
    setText('importHintEl', t('importHint'));
    setPlaceholder('bankSearch', t('bankSearchPlaceholder'));

    setText('topSelectedHeadingEl', t('topSelectedHeading'));
    setText('topUsedHeadingEl', t('topUsedHeading'));
    setText('footerTextEl', t('footerText'));

    setText('selectionHeadingEl', t('selectionHeading'));

    if(lastDraftKw.length) renderAnalysis(lastDraftKw);
    if(currentResults.length){
      var snapshot = shownCount;
      document.getElementById('resultsArea').innerHTML = '';
      shownCount = 0;
      while(shownCount < snapshot && shownCount < currentResults.length){
        showMoreResults(lastUnexpected);
      }
    }
    renderSelection();
    if(lastPreviewAf) openPreview(lastPreviewAf);

    var activeTab = document.querySelector('.tab-btn.active').dataset.tab;
    if(activeTab === 'bank') renderBankList();
    if(activeTab === 'stats') renderStats();
  }

  applyLanguage(currentLang);
})();
</script>
</body>
</html>
